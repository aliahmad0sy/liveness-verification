name = "liveness-telegram-bridge"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Restrict which origin(s) may POST to this Worker. Comma-separated.
# Leave unset (or empty) to allow any origin. Recommended: set this to your
# Vercel project's URL once it's deployed.
[vars]
ALLOWED_ORIGIN = ""

# Secrets (do NOT put values here — set with `wrangler secret put`):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID

# Observability — keep logs for debugging.
[observability]
enabled = true
